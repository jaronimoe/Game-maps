<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <!--
    Schematic map of Kamurocho as it appears in Yakuza Kiwami.
    Hand-drawn from written descriptions of the district; proportions are approximate.
    Coordinate system: x grows east, y grows south, 1 unit = 1 viewBox unit (1200 x 1000).
  -->
  <defs>
    <pattern id="trees" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="5" fill="#1d3627"/>
      <circle cx="20" cy="19" r="4" fill="#1b3224"/>
    </pattern>
    <pattern id="parking" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 0V14" stroke="#2c3242" stroke-width="2"/>
    </pattern>
    <pattern id="shacks" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="12" height="12" fill="#30251f"/>
    </pattern>
  </defs>

  <!-- backdrop + district footprint -->
  <rect width="1200" height="1000" fill="#0b0d12"/>
  <path d="M40 30H1160V622H945V940H40Z" fill="#1b1f29" stroke="#2a3040" stroke-width="2"/>

  <!-- areas -->
  <rect x="40" y="30" width="520" height="358" fill="#211b29"/>
  <rect x="572" y="30" width="588" height="220" fill="#15251c"/>
  <rect x="572" y="30" width="588" height="220" fill="url(#trees)"/>
  <path d="M590 205C690 120 790 215 900 150S1060 95 1150 130" fill="none" stroke="#2a4433" stroke-width="10" stroke-linecap="round"/>
  <path d="M770 40C785 120 850 160 875 245" fill="none" stroke="#2a4433" stroke-width="8" stroke-linecap="round"/>
  <rect x="648" y="84" width="24" height="24" rx="3" fill="#3b2a52" stroke="#6b4f94" stroke-width="2"/>
  <path d="M652 90h16M652 96h16M652 102h16" stroke="#8c6cc0" stroke-width="2"/>

  <rect x="182" y="312" width="126" height="76" rx="6" fill="#1a3022"/>
  <rect x="182" y="312" width="126" height="76" rx="6" fill="url(#trees)"/>
  <rect x="48" y="300" width="112" height="86" rx="4" fill="#232a3a" stroke="#34405a" stroke-width="2"/>
  <rect x="330" y="132" width="110" height="106" rx="4" fill="#232a3a" stroke="#34405a" stroke-width="2"/>
  <path d="M345 225L385 150L425 225" fill="none" stroke="#34405a" stroke-width="2"/>
  <rect x="566" y="278" width="108" height="110" fill="#1f2430"/>
  <rect x="566" y="278" width="108" height="110" fill="url(#parking)"/>

  <rect x="118" y="438" width="280" height="96" rx="8" fill="#2a3040"/>
  <rect x="240" y="540" width="140" height="44" rx="4" fill="#2d2633" stroke="#4a3c55" stroke-width="2"/>

  <path d="M520 588C540 540 680 540 700 588" fill="none" stroke="#3f475b" stroke-width="10"/>
  <path d="M584 424H636L674 462V514L636 552H584L546 514V462Z" fill="#2a3245" stroke="#6a7592" stroke-width="3"/>
  <path d="M594 446H626L652 472V504L626 530H594L568 504V472Z" fill="none" stroke="#46506a" stroke-width="2"/>

  <rect x="936" y="412" width="224" height="176" fill="#241c18"/>
  <rect x="936" y="412" width="224" height="176" fill="url(#shacks)"/>

  <rect x="372" y="784" width="86" height="56" rx="6" fill="#1a3022"/>
  <rect x="372" y="784" width="86" height="56" rx="6" fill="url(#trees)"/>

  <!-- roads -->
  <g fill="none" stroke-linecap="butt">
    <g stroke="#2f3544" stroke-width="10">
      <path d="M40 120H552M40 250H552M170 30V400M320 30V400M450 30V400"/>
      <path d="M1010 262V400"/>
      <path d="M240 770H470M355 600V770"/>
      <path d="M470 770H700M585 600V770"/>
      <path d="M700 770H922M810 600V770"/>
      <path d="M40 760H240"/>
    </g>
    <g stroke="#3a2c24" stroke-width="7">
      <path d="M936 470H1160M936 530H1160M985 412V588M1045 412V588M1105 412V588"/>
    </g>
    <g stroke="#2f3544" stroke-width="7">
      <path d="M520 655H585M705 525V600"/>
    </g>
    <g stroke="#3a4152">
      <path d="M552 30V400" stroke-width="14"/>
      <path d="M200 530V600" stroke-width="12"/>
      <path d="M438 400V600" stroke-width="14"/>
      <path d="M790 262V600" stroke-width="12"/>
      <path d="M240 600V940" stroke-width="22"/>
      <path d="M470 600V940" stroke-width="28"/>
      <path d="M700 600V940" stroke-width="20"/>
      <path d="M922 400V940" stroke-width="26"/>
    </g>
    <g stroke="#444c60">
      <path d="M552 262H1160" stroke-width="24"/>
      <path d="M40 400H1160" stroke-width="24"/>
      <path d="M40 922H945" stroke-width="28"/>
      <path d="M40 600H1160" stroke-width="38"/>
    </g>
    <path d="M40 600H1160" stroke="#596178" stroke-width="1.5" stroke-dasharray="14 12"/>
  </g>

  <!-- gates -->
  <g>
    <rect x="226" y="906" width="28" height="7" rx="2" fill="#d6453b"/>
    <rect x="226" y="906" width="4" height="22" fill="#d6453b"/>
    <rect x="250" y="906" width="4" height="22" fill="#d6453b"/>
    <rect x="688" y="906" width="24" height="6" rx="2" fill="#ff5fa2"/>
    <rect x="688" y="906" width="3" height="20" fill="#ff5fa2"/>
    <rect x="709" y="906" width="3" height="20" fill="#ff5fa2"/>
  </g>

  <!-- district labels -->
  <g fill="#8e86a6" font-weight="700" letter-spacing="6" text-anchor="middle" opacity="0.55">
    <text x="245" y="80" font-size="24">HOTEL DISTRICT</text>
    <text x="1010" y="215" font-size="24" fill="#7fa58b">WEST PARK</text>
    <text x="248" y="478" font-size="15" fill="#a0a8bd" letter-spacing="4">THEATER SQUARE</text>
    <text x="1048" y="498" font-size="15" fill="#c09a82">CHAMPION</text>
    <text x="1048" y="518" font-size="15" fill="#c09a82">DISTRICT</text>
  </g>
  <g fill="#9aa3ba" font-weight="700" text-anchor="middle" letter-spacing="2">
    <text x="610" y="485" font-size="11">MILLENNIUM</text>
    <text x="610" y="500" font-size="11">TOWER</text>
    <text x="310" y="566" font-size="10" fill="#b39cc4">THEATER</text>
    <text x="660" y="74" font-size="10" fill="#b79ce6">PURGATORY ↓</text>
  </g>

  <!-- street labels -->
  <g fill="#c3cad9" font-weight="600" letter-spacing="2" text-anchor="middle" font-size="11">
    <text x="880" y="266">PARK BLVD.</text>
    <text x="480" y="404">SHICHIFUKU ST.</text>
    <text x="960" y="404">SHICHIFUKU ST.</text>
    <text x="130" y="605" font-size="12">TAIHEI BLVD.</text>
    <text x="590" y="605" font-size="12">TAIHEI BLVD.</text>
    <text x="1050" y="605" font-size="12">TAIHEI BLVD.</text>
    <text x="580" y="927">SHOWA ST.</text>
    <text x="380" y="927">SHOWA ST.</text>
    <text transform="translate(244 850) rotate(-90)">TENKAICHI ST.</text>
    <text transform="translate(474 700) rotate(-90)">NAKAMICHI ST.</text>
    <text transform="translate(704 700) rotate(-90)">PINK ST.</text>
    <text transform="translate(926 820) rotate(-90)">SENRYO AVE.</text>
    <text transform="translate(926 460) rotate(-90)">SENRYO AVE.</text>
  </g>
  <g fill="#8d95a8" font-weight="600" letter-spacing="1.5" text-anchor="middle" font-size="8">
    <text x="130" y="763">SUPPON ST.</text>
    <text x="300" y="773">TENKAICHI ALLEY</text>
    <text x="520" y="773">NAKAMICHI ALLEY</text>
    <text x="760" y="773">PINK ALLEY</text>
    <text transform="translate(203 570) rotate(-90)">THEATER ALLEY</text>
    <text transform="translate(1013 330) rotate(-90)">PARK ALLEY</text>
    <text transform="translate(441 500) rotate(-90)">THEATER AVE.</text>
    <text transform="translate(358 680) rotate(-90)">TENKAICHI ALLEY</text>
    <text transform="translate(588 700) rotate(-90)">NAKAMICHI ALLEY</text>
    <text transform="translate(813 690) rotate(-90)">PINK ALLEY</text>
  </g>

  <!-- compass + caption in the empty south-east corner -->
  <g transform="translate(1065 745)">
    <circle r="34" fill="none" stroke="#2a3040" stroke-width="2"/>
    <path d="M0 -28L9 4L0 -2L-9 4Z" fill="#e2e6ef"/>
    <path d="M0 28L9 -4L0 2L-9 -4Z" fill="#3a4152"/>
    <text y="-40" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e6ef">N</text>
  </g>
  <g text-anchor="middle" fill="#59627a">
    <text x="1065" y="860" font-size="18" font-weight="700" letter-spacing="5">KAMUROCHO</text>
    <text x="1065" y="880" font-size="10" letter-spacing="1">schematic · not to scale</text>
  </g>
</svg>
